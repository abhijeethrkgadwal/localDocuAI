<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo:head-->
    <title>%META_TITLE%</title>
    <meta name="description" content="%META_DESCRIPTION%" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="%CANONICAL_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LocalDocu" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%CANONICAL_URL%" />
    <meta property="og:title" content="%META_TITLE%" />
    <meta property="og:description" content="%META_DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LocalDocu — Tell it what to do. Your files stay on your device." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%META_TITLE%" />
    <meta name="twitter:description" content="%META_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE_URL%" />
    <meta name="twitter:image:alt" content="LocalDocu — privacy-first local document tools" />
    <!--/seo:head-->
    <meta name="author" content="Abhijeeth Gadwal" />

    <meta name="theme-color" content="#0F766E" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="LocalDocu" />
    <meta name="apple-mobile-web-app-title" content="LocalDocu" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="alternate" type="text/plain" title="LLM brief" href="%SITE_URL%/llms.txt" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="%SITE_URL%/sitemap.xml" />

    <script>
      (function () {
        try {
          var pref = localStorage.getItem('localdocu-theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = pref;
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0D1110' : '#0F766E');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/pwa-192.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root"></div>
    <noscript>
      <p style="max-width: 42rem; margin: 1rem auto; padding: 0 1rem; font-family: system-ui, sans-serif">
        The interactive workspace needs JavaScript. Enable JavaScript to merge, split, compress or convert files locally.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
