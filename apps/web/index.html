    <link rel="alternate" type="text/plain" title="LLM brief" href="%SITE_URL%/llms.txt" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="%SITE_URL%/sitemap.xml" />

    <script>
      (function () {
        try {
          var pref = localStorage.getItem('localdocu-theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = pref;
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0D1110' : '#0F766E');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/pwa-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-192.svg" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root"></div>

    <!-- Crawlable fallback for agents/browsers without JS (same facts as in-app FAQ). -->
    <noscript>
      <main style="max-width: 42rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif">
        <h1>LocalDocu</h1>
        <p>Tell it what to do. Your files stay on your device.</p>
        <p>
          LocalDocu is privacy-first, local-first document automation for PDF and Word files.
          Merge, split, compress, rotate, and convert in your browser — document contents are not
          uploaded for processing in the current release. Enable JavaScript to use the interactive workspace.
        </p>
        <h2>Privacy</h2>
        <p>No authentication. No document-upload backend. Cloud processing: Off. LocalDocu AI: Off.</p>
        <h2>How it works</h2>
        <ol>
          <li>Select PDF, DOC, or DOCX files or a folder (or drag and drop).</li>
          <li>Choose an operation such as merge, split, compress, or convert.</li>
          <li>Run locally and save or download the result on your device.</li>
        </ol>
        <h2>Explore</h2>
        <ul>
          <li><a href="%SITE_URL%/merge-pdf">Merge PDF</a></li>
          <li><a href="%SITE_URL%/pdf-tools">PDF tools</a></li>
          <li><a href="%SITE_URL%/privacy">Privacy</a></li>
          <li><a href="%SITE_URL%/faq">FAQ</a></li>
          <li><a href="%SITE_URL%/how-it-works">How it works</a></li>
          <li><a href="%SITE_URL%/open-source">Open source</a></li>
          <li><a href="%SITE_URL%/contribute">Contribute</a></li>
          <li><a href="%SITE_URL%/roadmap">Roadmap</a></li>
        </ul>
        <p>
          <a href="%SITE_URL%/llms.txt">LLM brief</a> ·
          <a href="%SITE_URL%/sitemap.xml">Sitemap</a> ·
          <a href="%SITE_URL%/robots.txt">Robots</a>
        </p>

    <script type="module" src="/src/main.tsx"></script>
